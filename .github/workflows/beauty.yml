name: inject-beauty

on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WeChat IPA from release
        run: |
          mkdir -p dl
          wget -O dl/WeChat.ipa "https://github.com/yzrufo/weiyuan-sign/releases/download/v1/WeChat_8079_wx_免费版_v919.ipa"
          ls -lh dl/WeChat.ipa
      
      - name: Unzip IPA
        run: |
          mkdir -p build
          unzip -q dl/WeChat.ipa -d build
          ls build/Payload/WeChat.app/Frameworks/ | grep -E 'MYSkin|MYStyle' || echo "checking bundles..."
      
      - name: Compile beauty loader
        run: |
          APP=build/Payload/WeChat.app
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -isysroot $SDK -miphoneos-version-min=12.0 \
            -fobjc-arc -dynamiclib -framework Foundation \
            -Wl,-install_name,@executable_path/Frameworks/wechat_beauty_loader.dylib \
            wechat_beauty_loader.m -o $APP/Frameworks/wechat_beauty_loader.dylib
          chmod +x $APP/Frameworks/wechat_beauty_loader.dylib
          ls -lh $APP/Frameworks/wechat_beauty_loader.dylib
      
      - name: Inject loader
        run: |
          python3 inject_beauty.py build/Payload/WeChat.app/WeChat build/Payload/WeChat.app/Frameworks/wechat_beauty_loader.dylib
          python3 strip_codesig.py build/Payload/WeChat.app/WeChat 2>/dev/null || true
      
      - name: Sign all
        run: |
          APP=build/Payload/WeChat.app
          codesign --force --sign - $APP/Frameworks/wechat_beauty_loader.dylib
          for fw in $APP/Frameworks/*.framework; do
            [ -e "$fw" ] && codesign --force --sign - "$fw" 2>/dev/null || true
          done
          for bndl in $APP/Frameworks/*.bundle; do
            [ -e "$bndl" ] && codesign --force --sign - "$bndl" 2>/dev/null || true
          done
          codesign --force --deep --sign - $APP
          codesign --verify --strict $APP 2>&1 | head -5
          echo "Signing done"
      
      - name: Package IPA
        run: |
          cd build
          rm -f ../WeChat_beautified_signed.ipa
          zip -qrX ../WeChat_beautified_signed.ipa Payload
          ls -lh ../WeChat_beautified_signed.ipa
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeChat-beautified
          path: WeChat_beautified_signed.ipa
          retention-days: 7
