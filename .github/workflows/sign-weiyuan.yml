name: sign-weiyuan

on:
  workflow_dispatch:

jobs:
  sign:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile inject sign package
        run: bash "$GITHUB_WORKSPACE/github_actions_compile.sh"

      - name: Upload signed ipa as artifact
        uses: actions/upload-artifact@v4
        with:
          name: weiyuan-vipbypass-signed
          path: ${{ github.workspace }}/微颜-vipbypass-signed.ipa
          retention-days: 7

      - name: Show result
        run: echo "DONE - download weiyuan-vipbypass-signed artifact"
