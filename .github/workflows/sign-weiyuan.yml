name: sign-weiyuan

on:
  workflow_dispatch:
    # ???? ???????????  # ??? push ??????????????(??push ?? ??????, ?????)
  # push:
  #   branches: [ main ]
  #   paths:
  #     - 'vol_*.7z'

jobs:
  sign:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 7z
        run: |
          brew install 7zip 2>/dev/null || \
          curl -L -o /tmp/7z.sh "https://www.7-zip.org/macos/7zzs.sft" || true
          # ???: ????????xz (Linux/mac ???) + 7zz ?????
          which 7zz 7z xz 2>/dev/null || echo "need decompressor"

      - name: Decompress full_extract
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          # ???: vol.part07z + vol.part07z ... ??? 7z
          if ls vol.*.7z >/dev/null 2>&1; then
            echo "concatenate split 7z"
            cat vol.part*.7z > vol.7z || cat vol_*.7z > vol.7z
          fi
          # ??? (7zz ???, ??? xz)
          if command -v 7zz >/dev/null; then
            7zz x vol.7z -o.
          elif command -v 7z >/dev/null; then
            7z x vol.7z -o.
          else
            # ??? 7z ?????xz ?? ???
            echo "????7z/7zz; ??? brew 7zip"
            brew install 7zip
            7zz x vol.7z -o.
          fi
          # ??? full_extract/Payload/WeChat.app ??          ls -d full_extract/Payload/WeChat.app

      - name: Sign frida-gadget.dylib + frameworks + main binary
        run: |
          set -e
          APP="$GITHUB_WORKSPACE/full_extract/Payload/WeChat.app"
          echo "app: $APP"
          # 1) ?????framework ?????? + frida-gadget.dylib
          echo "[sign] frida-gadget.dylib"
          codesign --force --sign - "$APP/Frameworks/frida-gadget.dylib"
          echo "[sign] frameworks"
          for fw in "$APP"/Frameworks/*.framework; do
            [ -e "$fw" ] && codesign --force --sign - "$fw" 2>/dev/null || true
          done
          # 2) ??app (--deep ???, ????????+ ??????)
          echo "[sign] app (deep)"
          codesign --force --deep --sign - "$APP"
          echo "[verify]"
          codesign --verify --strict --verbose=2 "$APP" 2>&1 | head -20 || true

      - name: Build signed ipa (POSIX / ?????
        run: |
          set -e
          PARENT="$GITHUB_WORKSPACE/full_extract"
          cd "$PARENT"
          rm -f "$GITHUB_WORKSPACE/???-gadget-signed.ipa"
          # ??zip ??? zip ??? Payload/... ??POSIX ?????(macOS zip ??? /)
          zip -qrX "$GITHUB_WORKSPACE/???-gadget-signed.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/???-gadget-signed.ipa"

      - name: Upload signed ipa as artifact
        uses: actions/upload-artifact@v4
        with:
          name: weiyuan-gadget-signed
          path: ${{ github.workspace }}/???-gadget-signed.ipa
          retention-days: 7

      - name: Show result
        run: echo "DONE - ??Actions ??? weiyuan-gadget-signed artifact"
